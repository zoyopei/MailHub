# CI：push / PR 时验证后端、前端与 Docker 构建
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go 构建 / vet / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 构建
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: 测试（race 检测，覆盖 sync/worker 等并发路径）
        run: go test -race ./...

  frontend:
    name: 前端构建验证
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建（vite，含 TypeScript 编译）
        run: npm run build

  docker:
    name: Docker 镜像构建与运行验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像（多阶段：前端 → Go → distroless；不推送）
        run: docker build -t mailhub:ci .

      - name: 运行验证（部署侧指定 UID 1000:1000 + healthz）
        run: |
          SECRET=$(openssl rand -base64 32)
          docker run -d --name mailhub-ci \
            -u 1000:1000 \
            -e MAILHUB_API_TOKEN=ci-token \
            -e MAILHUB_SECRET_KEY="$SECRET" \
            -p 18099:18099 mailhub:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:18099/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18099/healthz && echo " <- healthz ok（含 /data 可写验证：SQLite 建库成功）"
          # 镜像不绑定用户（部署侧 -u/compose user 指定）：验证指定 UID 实际生效
          pid=$(docker inspect --format '{{.State.Pid}}' mailhub-ci)
          run_uid=$(awk '/^Uid:/ {print $2}' /proc/$pid/status)
          echo "运行 UID=$run_uid"
          [ "$run_uid" = "1000" ]
          docker rm -f mailhub-ci
