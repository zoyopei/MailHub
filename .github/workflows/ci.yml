# CI：push / PR 时验证后端、前端与 Docker 构建
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go 构建 / vet / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 构建
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: 测试（race 检测，覆盖 sync/worker 等并发路径）
        run: go test -race ./...

  frontend:
    name: 前端构建验证
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建（vite，含 TypeScript 编译）
        run: npm run build

  docker:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像（多阶段：前端 → Go → distroless；不推送）
        run: docker build -t mailhub:ci .
