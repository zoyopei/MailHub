# Release：打 v* 标签时构建前端 + 多平台二进制，发布到 GitHub Release
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-web:
    name: 构建前端产物
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  binaries:
    name: 二进制 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 用真实前端产物覆盖占位 index.html（web/embed.go 内嵌）
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: 构建
        run: go build -trimpath -ldflags="-s -w" -o build/mailhub ./cmd/mailhub

      - name: 打包（Linux/macOS tar.gz）
        if: matrix.goos != 'windows'
        run: |
          cd build
          tar -czf "mailhub_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" mailhub

      - name: 打包（Windows zip）
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/mailhub.exe -DestinationPath "build/mailhub_${{ github.ref_name }}_windows_amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/mailhub_*
          retention-days: 1

  release:
    name: 发布 GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkg
          merge-multiple: true

      - name: 生成 checksums
        run: |
          cd pkg
          sha256sum mailhub_* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pkg/*
