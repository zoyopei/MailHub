# Docker 镜像：构建多架构镜像并推送 Docker Hub
#   tag v*      → <image>:版本号 / 次版本 / latest
#   push main   → <image>:dev
# 前置 Secrets（未配置时本工作流自动跳过）：
#   DOCKERHUB_USERNAME  登录账号（个人账号即可，需对目标仓库有写权限）
#   DOCKERHUB_TOKEN     Docker Hub → Account Settings → Personal access tokens（Read & Write）
#   DOCKERHUB_IMAGE     可选，完整镜像名（如 myorg/mailhub 推送到组织命名空间）；
#                       未配置时回退 <DOCKERHUB_USERNAME>/mailhub
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 前置检查：secrets 不能用于 job 级 if，经此 job 的 output 中转
  check:
    name: 检查 Docker Hub 凭据
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.cred.outputs.ok }}
    steps:
      - id: cred
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USER" ] && [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN Secrets，跳过镜像推送"
          fi

  build-push:
    name: 构建并推送多架构镜像
    needs: check
    # 凭据未配置时跳过（不报红），配置后下次 push 生效或手动重跑
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 镜像名在本 job 内解析（优先 DOCKERHUB_IMAGE，回退个人命名空间）。
      # 不经 needs outputs 跨 job 传递：其值含 secret 子串时会被置空。
      - name: 解析镜像名
        id: resolve
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}
        run: |
          if [ -n "$IMAGE" ]; then
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "image=${USER}/mailhub" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.resolve.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Dockerfile 内按 TARGETARCH 交叉编译，全部阶段在构建机原生架构运行，无需 QEMU
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
