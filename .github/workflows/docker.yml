# Docker 镜像：构建多架构镜像并推送 Docker Hub
#   tag v*      → <user>/mailhub:版本号 / 次版本 / latest
#   push main   → <user>/mailhub:dev
# 前置：仓库 Secrets 配置 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN（未配置时本工作流自动跳过）
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mailhub

jobs:
  build-push:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    # secrets 未配置时跳过（不报红），配置后下次 push 生效或手动重跑
    if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Dockerfile 内按 TARGETARCH 交叉编译，全部阶段在构建机原生架构运行，无需 QEMU
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
